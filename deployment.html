<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deployment</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ddd;font:13px system-ui,sans-serif}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#999;background:#000;z-index:10;pointer-events:none}
#status.error{color:#f0a0a8;white-space:pre-wrap;text-align:center;padding:24px;box-sizing:border-box}
#progress{position:fixed;left:50%;top:50%;width:min(520px,calc(100vw - 48px));transform:translate(-50%,-50%);z-index:11;color:#aaa;text-align:center}
#progress.hidden{display:none}
#progressTitle{font-size:14px;margin-bottom:12px;color:#ddd}
#progressTrack{width:100%;height:8px;border-radius:999px;background:#202020;overflow:hidden;box-shadow:inset 0 0 0 1px #303030}
#progressBar{height:100%;width:0%;background:#3cdfa9;border-radius:999px;transition:width .12s ease}
#progress.indeterminate #progressBar{width:35%;animation:deploymentProgress 1.15s ease-in-out infinite}
#progressMeta{margin-top:9px;font-size:12px;color:#777;min-height:16px}
@keyframes deploymentProgress{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}
#stage{position:fixed;inset:0;display:none;background:#000}
#stage.ready{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
<script>
window.__deploymentAssetsReady = (async function() {
  const sources = [
    'browser/external/acorn.js',
    'browser/external/acorn-walk.js',
    'browser/external/astring.js',
    'browser/external/jszip.js',
    'browser/lib/filesystem.js',
    'browser/lib/network.js',
    'browser/lib/emulator.js',
    'browser/lib/npm.js',
    'browser/lib/endpoints/app.js',
    'browser/lib/endpoints/static.js',
    'browser/external/peer.js',
    'browser/lib/keepalive.js',
    'browser/lib/endpoints/peer.js'
  ];

  // Keep asset references relative to this deployment document. Do not resolve
  // them through the emulated project URL.

  for (const source of sources) {
    const script = document.createElement('script');
    script.src = source;
    await new Promise((resolve, reject) => {
      script.addEventListener('load', resolve, {once:true});
      script.addEventListener('error', () => reject(new Error('Failed to load deployment asset: ' + script.src)), {once:true});
      document.head.appendChild(script);
    });
  }
})(); 
</script>
</head>
<body>
<div id="stage"></div>
<div id="status">Loading deployment…</div>
<div id="progress">
  <div id="progressTitle">Loading deployment…</div>
  <div id="progressTrack"><div id="progressBar"></div></div>
  <div id="progressMeta"></div>
</div>
<script>
window.__deploymentNetworkReady = (async function() {
  await window.__deploymentAssetsReady;
  const embeddedWorkers = window.__WKStandaloneData?.workers;
  const validWorkers = value => !!value && typeof value === 'object' && !Array.isArray(value);
  const workers = validWorkers(embeddedWorkers)
    ? embeddedWorkers
    : window.__WKStandaloneData
      ? (console.warn('Standalone export has no valid embedded workers configuration; continuing without proxy endpoints.'), {proxy:'',fallbackProxy:''})
      : await fetch('workers.json',{cache:'no-store'}).then(async r => {
          if (!r.ok) throw new Error(`Failed to load workers.json (${r.status}).`);
          const value = await r.json();
          if (!validWorkers(value)) throw new Error('workers.json must contain a JSON object.');
          return value;
        }).catch(e => {
          console.error(e);
          return {proxy:'',fallbackProxy:''};
        });
  window.WorkerConfig = workers;
  const network = new Network();
  const native = new NetworkEndpoint(true, true);
  native.__networkRole = 'native';

  // Keep the deployment network's base endpoints aligned with the browser:
  // native fetch is the default error source, followed by the primary proxy
  // and the optional fallback proxy.
  const primaryProxyUrl = String(workers.proxy || '').trim();
  const fallbackProxyUrl = typeof workers.fallbackProxy === 'string' ? workers.fallbackProxy.trim() : '';
  const primaryProxy = new ProxyNetworkEndpoint(primaryProxyUrl, true, !!primaryProxyUrl);
  const fallbackProxy = new ProxyNetworkEndpoint(fallbackProxyUrl, true, !!fallbackProxyUrl);

  network.setEndpoints([
    native,
    primaryProxy,
    fallbackProxy
  ]);
  network.__deploymentBaseEndpoints = {
    native,
    primary: primaryProxy,
    fallback: fallbackProxy
  };
  return network;
})();

(async () => {
  const status = document.getElementById('status');
  const stage = document.getElementById('stage');
  const progress = document.getElementById('progress');
  const progressTitle = document.getElementById('progressTitle');
  const progressBar = document.getElementById('progressBar');
  const progressMeta = document.getElementById('progressMeta');
  const params = new URLSearchParams(location.search);

  function formatBytes(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    if (n < 1024 * 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    return `${(n / (1024 * 1024 * 1024)).toFixed(2)} GB`;
  }

  function setProgress(title, percent = null, meta = '') {
    progress.classList.remove('hidden');
    progress.classList.toggle('indeterminate', percent == null);
    progressTitle.textContent = title;
    progressMeta.textContent = meta;
    if (percent != null && Number.isFinite(Number(percent))) {
      progressBar.style.width = `${Math.max(0, Math.min(100, Number(percent)))}%`;
    }
  }

  function hideProgress() {
    progress.classList.add('hidden');
    progress.classList.remove('indeterminate');
  }

  async function responseToBlobWithProgress(response, label) {
    const total = Number(response.headers?.get?.('content-length')) || 0;
    if (!response.body?.getReader) {
      setProgress(label, total ? 12 : null, total ? formatBytes(total) : 'Preparing download…');
      const blob = await response.blob();
      setProgress(label, 100, formatBytes(blob.size));
      return blob;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      if (!value) continue;
      chunks.push(value);
      received += value.byteLength;
      const percent = total ? (received / total) * 100 : null;
      setProgress(
        label,
        percent,
        total ? `${formatBytes(received)} / ${formatBytes(total)}` : `${formatBytes(received)} downloaded`
      );
    }

    const blob = new Blob(chunks, {type: response.headers?.get?.('content-type') || 'application/zip'});
    setProgress(label, 100, formatBytes(blob.size));
    return blob;
  }
  let network;
  try {
    network = await window.__deploymentNetworkReady;
  } catch (error) {
    showError(error);
    return;
  }

  function requiredParam(name) {
    if (!params.has(name)) throw new Error(`Deployment requires a ${name} query parameter.`);
    const value = String(params.get(name) || '').trim();
    if (!value) throw new Error(`Deployment requires a non-empty ${name} query parameter.`);
    return value;
  }

  function requiredPresence(name) {
    if (!params.has(name)) throw new Error(`Deployment requires a ${name} query parameter.`);
    return String(params.get(name) || '');
  }

  function requiredBooleanParam(name) {
    const raw = requiredParam(name).toLowerCase();
    if (raw === '1' || raw === 'true') return true;
    if (raw === '0' || raw === 'false') return false;
    throw new Error(`Deployment parameter ${name} must be true/false.`);
  }

  function showError(error) {
    console.error('[Deployment startup]', error);
    hideProgress();
    status.textContent = error?.stack
      ? (error.message || String(error)) + '\\n\\n' + error.stack
      : (error?.message || String(error));
    status.className = 'error';
    if (!status.isConnected) document.body.appendChild(status);
  }

  // Surface failures that happen before main() is reached, especially
  // rejected embedded-asset and network bootstrap promises.
  window.addEventListener('error', event => {
    if (!stage.classList.contains('ready')) {
      showError(event.error || event.message || 'A deployment startup script failed.');
    }
  });
  window.addEventListener('unhandledrejection', event => {
    if (!stage.classList.contains('ready')) {
      showError(event.reason || 'A deployment startup promise was rejected.');
    }
  });

  function parseGithub(input) {
    let url;
    try { url = new URL(input); } catch (_) { throw new Error('Invalid GitHub URL.'); }
    if (!/^https?:$/i.test(url.protocol) || !/^(www\.)?github\.com$/i.test(url.hostname)) throw new Error('Deployment requires a GitHub repository URL.');
    const parts = url.pathname.split('/').filter(Boolean);
    if (parts.length < 2) throw new Error('Invalid GitHub repository URL.');
    return {owner:parts[0],repo:parts[1].replace(/\.git$/i,'')};
  }
  async function getRepositoryInfo(owner, repo) {
    const response = await network.request(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, undefined, {headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}}, 'deployment-github-api');
    if (!response.ok) throw new Error(`GitHub repository lookup failed (${response.status}).`);
    const data = await response.json();
    return {defaultBranch:String(data?.default_branch || 'main')};
  }
  async function loadArchive(owner, repo, ref) {
    const codeload = `https://codeload.github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/zip/${encodeURIComponent(ref).replace(/%2F/g,'/')}`;
    const response = await network.request(codeload, undefined, {}, 'deployment-archive');
    if (!response.ok) throw new Error(`GitHub archive download failed (${response.status}).`);
    setProgress('Downloading project archive…', response.headers?.get?.('content-length') ? 0 : null, 'Connecting to GitHub…');
    const blob = await responseToBlobWithProgress(response, 'Downloading project archive…');
    if (!blob.size) throw new Error('GitHub returned an empty project archive.');
    return blob;
  }
  function flattenZip(file) {
    setProgress('Inspecting project archive…', 0, 'Reading ZIP structure…');
    return JSZip.loadAsync(file, {
      createFolders: true,
      onUpdate: meta => setProgress(
        'Inspecting project archive…',
        Number(meta?.percent) || 0,
        meta?.currentFile ? `Reading ${meta.currentFile}` : 'Reading ZIP structure…'
      )
    }).then(async zip => {
      const entries = [], tops = new Set(); let rootFile = false;
      zip.forEach((path, entry) => {
        const clean = path.replace(/^\/+|\/+$/g,'');
        if (!clean) return;
        const parts = clean.split('/');
        if (parts.length === 1) { if (!entry.dir) rootFile = true; return; }
        tops.add(parts[0]); entries.push({clean,entry});
      });
      if (rootFile || tops.size !== 1 || !entries.length) return file;
      const root = [...tops][0];
      if (!entries.some(item => item.clean.startsWith(root + '/'))) return file;
      const out = new JSZip();
      for (const item of entries) {
        if (!item.clean.startsWith(root + '/')) continue;
        const target = item.clean.slice(root.length + 1);
        if (!target) continue;
        if (item.entry.dir) out.folder(target);
        else out.file(target, await item.entry.async('uint8array'));
      }
      const blob = await out.generateAsync(
        {type:'blob'},
        meta => setProgress(
          'Flattening project archive…',
          Number(meta?.percent) || 0,
          meta?.currentFile ? `Writing ${meta.currentFile}` : 'Building normalized archive…'
        )
      );
      return new File([blob], file.name || 'project.zip', {type:'application/zip'});
    });
  }
  function readJSON(fs, path) {
    try { return fs.existsSync(path) ? JSON.parse(fs.readFileSync(path,'utf8') || '{}') : {}; }
    catch (_) { return {}; }
  }
  function normalizeRoot(value) { return '/' + String(value || '/').replace(/^\/+|\/+$/g,''); }
  function normalizePath(value) {
    let s = String(value || '/').trim();
    if (!s) return '/';
    try {
      const url = new URL(s, 'http://deployment.local');
      s = url.pathname || '/';
      if (!s.startsWith('/')) s = '/' + s;
      const suffix = (url.search || '') + (url.hash || '');
      return (s === '/' ? '/' : s.replace(/\/+$/,'')) + suffix;
    } catch (_) {
      if (!s.startsWith('/')) s = '/' + s;
      return s === '/' ? '/' : s.replace(/\/+$/,'');
    }
  }
  function pathParts(value) {
    const raw = normalizePath(value);
    const match = raw.match(/^([^?#]*)([?#].*)?$/);
    return {pathname:match?.[1] || '/', suffix:match?.[2] || ''};
  }
  function readProcessEnv(fs) {
    try {
      if (!fs?.existsSync?.('/.editor/process.env')) return {};
      const env = {};
      for (const raw of String(fs.readFileSync('/.editor/process.env', 'utf8') || '').split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith('#')) continue;
        const body = line.startsWith('export ') ? line.slice(7).trim() : line;
        const i = body.indexOf('=');
        if (i <= 0) continue;
        const key = body.slice(0, i).trim();
        if (!key) continue;
        let value = body.slice(i + 1).trim();
        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
          value = value.slice(1, -1);
        }
        env[key] = value.replace(/\\n/g, '\n');
      }
      return env;
    } catch (_) {
      return {};
    }
  }

  function normalizeDomain(value) {
    let s = String(value || 'http://localhost:3000/').trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'http://' + s;
    try { return new URL(s).origin; } catch (_) { return 'http://localhost:3000'; }
  }
  async function main() {
    const pathOverride = requiredParam('path');
    const githubURL = requiredParam('github');
    const repo = parseGithub(githubURL);
    await getRepositoryInfo(repo.owner, repo.repo);
    const branchOverride = requiredParam('branch');
    const commitOverride = requiredParam('commit');
    let resolvedRef = commitOverride;
    if (commitOverride === 'latest') {
      const commitsResponse = await network.request(
        `https://api.github.com/repos/${encodeURIComponent(repo.owner)}/${encodeURIComponent(repo.repo)}/commits?sha=${encodeURIComponent(branchOverride)}&per_page=1`,
        undefined,
        {headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}},
        'deployment-github-latest'
      );
      if (!commitsResponse?.ok) {
        throw new Error(`Unable to resolve latest commit for branch "${branchOverride}" (${commitsResponse?.status || 'no response'}).`);
      }
      const commits = await commitsResponse.json().catch(() => []);
      resolvedRef = String(commits?.[0]?.sha || '').trim();
      if (!/^[0-9a-f]{7,40}$/i.test(resolvedRef)) {
        throw new Error(`No commits are available on GitHub branch "${branchOverride}".`);
      }
    } else if (!/^[0-9a-f]{7,40}$/i.test(commitOverride)) {
      throw new Error('Deployment requires a commit SHA or "latest".');
    }

    const rawTarget = pathOverride || urlOverride;
    async function loadRevision(ref) {
      status.textContent = 'Loading deployment revision…';
      setProgress('Downloading project archive…', null, 'Preparing download…');
      const blob = await loadArchive(repo.owner, repo.repo, ref);
      setProgress('Preparing project files…', null, `Archive downloaded: ${formatBytes(blob.size)}`);
      const file = await flattenZip(new File([blob], repo.repo + '.zip', {type:'application/zip'}));
      setProgress('Indexing project files…', null, 'Building virtual filesystem…');
      const fs = await FileSystem.create(file, {sync:false});
      setProgress('Project ready', 100, `${formatBytes(blob.size)} archive`);
      return {blob,file,fs};
    }

    const revision = await loadRevision(resolvedRef);
    const fs = revision.fs;
    const runConfigFromProject = readJSON(fs, '/.editor/config.json');
    const inferredRunConfig = {
      serverType: 'static',
      domain: 'http://localhost:3000/',
      path: '/',
      rootfolder: '/',
      runfile: '/index.html',
      cwd: '/',
      nodeCommand: ''
    };
    const runConfig = {...inferredRunConfig, ...runConfigFromProject};
    // The deployment wrapper explicitly opts into the peer server. The
    // project config still owns the peer layer itself.
    const usePeerServer = params.get('usePeerServer') === '1';
    const peerLayer = String(runConfig.peerLayer || 'peer').trim() || 'peer';
    const saveEnvironmentVariables = runConfig.saveEnvironmentVariables === true;
    const deploymentEnvironment = saveEnvironmentVariables ? readProcessEnv(fs) : {};
    const type = runConfig.serverType === 'node' ? 'node' : 'static';

    function resolveEditorTarget(value) {
      const raw = String(value || '').trim();
      const configuredDomain = normalizeDomain(runConfig.domain);
      try {
        const absolute = new URL(raw);
        if (/^https?:$/i.test(absolute.protocol)) return absolute.href;
      } catch (_) {}
      const path = raw.startsWith('/') ? raw : '/' + raw;
      return configuredDomain + path;
    }

    const deploymentOrigin = normalizeDomain(runConfig.domain);
    const initialTargetUrl = new URL(resolveEditorTarget(rawTarget));

    // A deployment only emulates documents that belong to its configured origin.
    if (initialTargetUrl.origin !== deploymentOrigin) {
      location.replace(initialTargetUrl.href);
      return;
    }

    const domain = deploymentOrigin;
    const runtimePath = pathParts(runConfig.path || '/').pathname || '/';

    let peerEndpoint = null;
    if (usePeerServer) {
      try { peerEndpoint = new PeerEndpoint(); }
      catch (e) { console.warn('Peer network unavailable:', e); }
    }

    const root = normalizeRoot(runConfig.rootfolder);
    let runtime;

    function forwardConsole(method, args) {
      const target = method === 'logText' ? console.log : console[method];
      if (typeof target !== 'function') return;
      try { target.apply(console, Array.isArray(args) ? args : [args]); } catch (_) {}
    }

    let deploymentStartupComplete = false;
    function forwardError(error, location) {
      const message = error?.message || String(error);
      const stack = error?.error?.stack || error?.stack || '';
      const suffix = location ? ` (${location})` : '';
      try { console.error(`Uncaught Error${suffix}: ${message}`, stack); } catch (_) {}
      if (!deploymentStartupComplete) {
        const startupError = new Error(`The project failed while its initial page was starting: ${message}${suffix}`);
        if (stack) startupError.stack = stack;
        showError(startupError);
      }
    }

    if (type === 'static') {
      runtime = new StaticEndpoint({
        domain,
        path: runtimePath,
        rootfolder: root,
        runfile: runConfig.runfile || '/index.html',
        filesystem: fs
      });
      await runtime.loading;
    } else {
      runtime = new NodeEmulator({
        domain,
        rootfolder: root,
        pathPrefix: runtimePath,
        filesystem: fs,
        fileSystemSync: false,
        network,
        cwd: runConfig.cwd || '/',
        env: {NODE_ENV:'production', USER:'browser_user', ...deploymentEnvironment}
      });
      await runtime.ready;

      // Published repositories normally omit node_modules. Reconstruct the
      // dependency tree inside the Node emulator before starting the app.
      const packageJsonPath = root === '/' ? '/package.json' : root + '/package.json';
      const packageLockPath = root === '/' ? '/package-lock.json' : root + '/package-lock.json';
      const nodeModulesPath = root === '/' ? '/node_modules' : root + '/node_modules';
      // FileSystem normalizes paths without a leading slash and tracks directories separately.
      const normalizedNodeModulesPath = nodeModulesPath.replace(/^\/+|\/+$/g, '');
      const hasNodeModules = fs.isDirectorySync?.(nodeModulesPath) ||
        fs.listFilesSync().some(path => String(path || '').replace(/^\/+/, '').startsWith(normalizedNodeModulesPath + '/'));
      let hasDeclaredDependencies = fs.existsSync(packageJsonPath);
      if (hasDeclaredDependencies) {
        try {
          const manifest = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8') || '{}');
          hasDeclaredDependencies = [manifest.dependencies, manifest.devDependencies, manifest.optionalDependencies]
            .some(dependencies => dependencies && typeof dependencies === 'object' && Object.keys(dependencies).length > 0);
        } catch (_) {
          // Leave installation enabled so npm reports an invalid package.json.
        }
      }
      if (hasDeclaredDependencies && !hasNodeModules) {
        let useCi = false;
        if (fs.existsSync(packageLockPath)) {
          try {
            const lock = JSON.parse(fs.readFileSync(packageLockPath, 'utf8') || '{}');
            useCi = !!lock?.packages && typeof lock.packages === 'object' && !Array.isArray(lock.packages);
          } catch (_) {}
        }
        const packageCommand = useCi ? 'npm ci' : 'npm install';
        setProgress(
          'Installing Node dependencies…',
          null,
          useCi ? 'Running npm ci from package-lock.json' : (fs.existsSync(packageLockPath) ? 'Running npm install from package-lock.json' : 'Running npm install from package.json')
        );
        await runtime.terminalCommand(packageCommand);
        setProgress('Dependencies installed', 100, useCi ? 'package-lock.json applied' : 'package dependencies installed');
      }

      if (runConfig.nodeCommand) await runtime.terminalCommand(runConfig.nodeCommand);
      if (!await runtime.waitForServer?.(10000,50)) {
        throw new Error('Node command finished, but no listening server was created.');
      }
    }

    const runtimeEndpoint = type === 'node' ? runtime.endpoint : runtime;

    // Always give the online peer endpoint first priority. This is important
    // when a local Node/static runtime also exists: the deployment should use
    // the already-hosted peer instance rather than shadowing it with local files.
    const deploymentEndpoints = [];
    if (peerEndpoint) deploymentEndpoints.push(peerEndpoint);
    deploymentEndpoints.push(runtimeEndpoint);
    deploymentEndpoints.push(
      network.__deploymentBaseEndpoints.native,
      network.__deploymentBaseEndpoints.primary,
      network.__deploymentBaseEndpoints.fallback
    );
    network.setEndpoints(deploymentEndpoints);

    if (runtime?.addEventListener) {
      runtime.addEventListener('console', (method, args) => forwardConsole(method, args));
      runtime.addEventListener('error', (error, location) => forwardError(error, location));
    }

    if (usePeerServer) {
      const layer = peerLayer;
      status.textContent = 'Starting peer server…';
      window.__deploymentPeerServer = await ensurePeerServer(
        domain,
        async()=>type === 'node' ? runtime.endpoint : runtime,
        {peerLayer:layer}
      );
    }

    const iframe = document.createElement('iframe');
    stage.appendChild(iframe);
    const pageURL = initialTargetUrl.href;
    const page = new PageEmulator(iframe, {
      network,
      location: {url: pageURL, origin: domain},
      history: []
    });

    const deploymentRootPage = page;

    // Mirror the active emulated document's identity in the outer deployment
    // tab. The project still runs inside its PageEmulator; only its metadata
    // is reflected onto the wrapper document.
    const deploymentFavicon = document.createElement('link');
    deploymentFavicon.rel = 'icon';
    deploymentFavicon.id = 'deployment-page-favicon';
    document.head.appendChild(deploymentFavicon);

    let deploymentMetadataObserver = null;
    let deploymentMetadataDocument = null;
    let deploymentMetadataRequestId = 0;
    let deploymentMetadataIconSource = null;

    function getDeploymentFallbackTitle() {
      try {
        const current = new URL(page.location?.url || pageURL);
        const filename = current.pathname.split('/').filter(Boolean).pop();
        if (filename) {
          try { return decodeURIComponent(filename); } catch (_) { return filename; }
        }
        return current.hostname || 'Deployment';
      } catch (_) {
        return 'Deployment';
      }
    }

    function getDeploymentIconLink(targetDocument) {
      const links = Array.from(targetDocument.querySelectorAll('link[rel][href], link[rel][data-raw-href]'));
      return links.find(link => link.relList?.contains('icon')) ||
        links.find(link => link.relList?.contains('apple-touch-icon')) ||
        links.find(link => link.relList?.contains('mask-icon')) ||
        null;
    }

    async function updateDeploymentFavicon(targetDocument) {
      const requestId = ++deploymentMetadataRequestId;
      const iconLink = getDeploymentIconLink(targetDocument);
      const href = iconLink
        ? (iconLink.getAttribute('href') || iconLink.getAttribute('data-raw-href') || '').trim()
        : '';

      let source = href;
      if (!source) {
        try { source = new URL('/favicon.ico', page.location?.url || pageURL).href; }
        catch (_) { source = ''; }
      }

      if (!source) {
        deploymentMetadataIconSource = null;
        deploymentFavicon.removeAttribute('href');
        return;
      }

      let resolved;
      try { resolved = new URL(source, page.location?.url || pageURL); }
      catch (_) {
        deploymentMetadataIconSource = null;
        deploymentFavicon.removeAttribute('href');
        return;
      }

      const sourceKey = resolved.href;
      if (sourceKey === deploymentMetadataIconSource) return;
      deploymentMetadataIconSource = sourceKey;

      if (resolved.protocol === 'data:' || resolved.protocol === 'blob:') {
        if (requestId === deploymentMetadataRequestId) deploymentFavicon.href = resolved.href;
        return;
      }

      if (!['http:', 'https:'].includes(resolved.protocol)) {

        return;
      }

      try {
        await loadEmulatedPage(targetUrl.href, {
          page,
          requestType: 'navigation',
          recordHistory: false
        });

        const historyIndex = page.history.lastIndexOf(targetUrl.href);
        if (historyIndex >= 0) {
          page.historyIndex = historyIndex;
        } else {
          updatePageHistory(targetUrl.href, false, page);
        }
      } catch (error) {
        console.error('Could not restore deployment history entry:', error);
      }
    });

    setProgress('Starting project…', null, 'Launching deployment runtime…');
    status.textContent = 'Starting project…';

    const response = await network.request(
      pageURL,
      domain,
      {},
      'deployment'
    );

    if (!response?.ok) {
      throw new Error(
        `Project entry page failed to load (${response?.status || 'no response'}).`
      );
    }

    const html = await response.text();
    await page.setDocument(html, true, pageURL);
    stage.classList.add('ready');
    setProgress('Deployment ready', 100, pageURL);
    hideProgress();
    status.remove();
  }
  main().catch(showError);
})();
</script>
</body>
</html>
