<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deployment</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ddd;font:13px system-ui,sans-serif}
#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#999;background:#000;z-index:10;pointer-events:none}
#status.error{color:#f0a0a8;white-space:pre-wrap;text-align:center;padding:24px;box-sizing:border-box}
#progress{position:fixed;left:50%;top:50%;width:min(520px,calc(100vw - 48px));transform:translate(-50%,-50%);z-index:11;color:#aaa;text-align:center}
#progress.hidden{display:none}
#progressTitle{font-size:14px;margin-bottom:12px;color:#ddd}
#progressTrack{width:100%;height:8px;border-radius:999px;background:#202020;overflow:hidden;box-shadow:inset 0 0 0 1px #303030}
#progressBar{height:100%;width:0%;background:#3cdfa9;border-radius:999px;transition:width .12s ease}
#progress.indeterminate #progressBar{width:35%;animation:deploymentProgress 1.15s ease-in-out infinite}
#progressMeta{margin-top:9px;font-size:12px;color:#777;min-height:16px}
@keyframes deploymentProgress{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}
#stage{position:fixed;inset:0;display:none;background:#000}
#stage.ready{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}
</style>
<script src="browser/external/acorn.js"></script>
<script src="browser/external/acorn-walk.js"></script>
<script src="browser/external/astring.js"></script>
<script src="browser/external/jszip.js"></script>
<script src="browser/lib/filesystem.js"></script>
<script src="browser/lib/network.js"></script>
<script src="browser/lib/emulator.js"></script>
<script src="browser/lib/npm.js"></script>
<script src="browser/lib/endpoints/app.js"></script>
<script src="browser/lib/endpoints/static.js"></script>
<script src="browser/external/peer.js"></script>
<script src="browser/lib/keepalive.js"></script>
<script>window.__peerLayer = new URLSearchParams(location.search).get('peerLayer') || 'peer';</script>
<script src="browser/lib/endpoints/peer.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="status">Loading deployment…</div>
<div id="progress">
  <div id="progressTitle">Loading deployment…</div>
  <div id="progressTrack"><div id="progressBar"></div></div>
  <div id="progressMeta"></div>
</div>
<script>
window.__deploymentNetworkReady = (async function() {
  const workers = await fetch('workers.json',{cache:'no-store'}).then(async r => {
    if (!r.ok) throw new Error(`Failed to load workers.json (${r.status}).`);
    return await r.json();
  }).catch(e => {
    console.error(e);
    return {proxy:'',fallbackProxy:false};
  });
  window.WorkerConfig = workers;
  const network = new Network();
  const native = new NetworkEndpoint(true, true);
  native.__networkRole = 'native';

  // Keep the deployment network's base endpoints aligned with the browser:
  // native fetch is the default error source, followed by the primary proxy
  // and the optional fallback proxy.
  const primaryProxyUrl = String(workers.proxy || '').trim();
  const fallbackProxyUrl = typeof workers.fallbackProxy === 'string' ? workers.fallbackProxy.trim() : '';
  const primaryProxy = new ProxyNetworkEndpoint(primaryProxyUrl, true, !!primaryProxyUrl);
  const fallbackProxy = new ProxyNetworkEndpoint(fallbackProxyUrl, true, !!fallbackProxyUrl);

  network.setEndpoints([
    native,
    primaryProxy,
    fallbackProxy
  ]);
  network.__deploymentBaseEndpoints = {
    native,
    primary: primaryProxy,
    fallback: fallbackProxy
  };
  return network;
})();

(async () => {
  const status = document.getElementById('status');
  const stage = document.getElementById('stage');
  const progress = document.getElementById('progress');
  const progressTitle = document.getElementById('progressTitle');
  const progressBar = document.getElementById('progressBar');
  const progressMeta = document.getElementById('progressMeta');
  const params = new URLSearchParams(location.search);

  function formatBytes(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    if (n < 1024 * 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    return `${(n / (1024 * 1024 * 1024)).toFixed(2)} GB`;
  }

  function setProgress(title, percent = null, meta = '') {
    progress.classList.remove('hidden');
    progress.classList.toggle('indeterminate', percent == null);
    progressTitle.textContent = title;
    progressMeta.textContent = meta;
    if (percent != null && Number.isFinite(Number(percent))) {
      progressBar.style.width = `${Math.max(0, Math.min(100, Number(percent)))}%`;
    }
  }

  function hideProgress() {
    progress.classList.add('hidden');
    progress.classList.remove('indeterminate');
  }

  async function responseToBlobWithProgress(response, label) {
    const total = Number(response.headers?.get?.('content-length')) || 0;
    if (!response.body?.getReader) {
      setProgress(label, total ? 12 : null, total ? formatBytes(total) : 'Preparing download…');
      const blob = await response.blob();
      setProgress(label, 100, formatBytes(blob.size));
      return blob;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      if (!value) continue;
      chunks.push(value);
      received += value.byteLength;
      const percent = total ? (received / total) * 100 : null;
      setProgress(
        label,
        percent,
        total ? `${formatBytes(received)} / ${formatBytes(total)}` : `${formatBytes(received)} downloaded`
      );
    }

    const blob = new Blob(chunks, {type: response.headers?.get?.('content-type') || 'application/zip'});
    setProgress(label, 100, formatBytes(blob.size));
    return blob;
  }
  const githubURL = params.get('github') || params.get('githubUrl') || '';
  let resolvedCommit = params.get('commit') || params.get('sha') || '';
  const requestedPath = params.get('path') || params.get('url') || '';
  let usePeerNetwork = params.has('usePeerNetwork') ? (params.get('usePeerNetwork') === '1' || params.get('usePeerNetwork') === 'true' || params.get('usePeerNetwork') === '') : null;
  const network = await window.__deploymentNetworkReady;

  function showError(error) {
    console.error(error);
    hideProgress();
    status.textContent = error?.message || String(error);
    status.className = 'error';
  }
  function parseGithub(input) {
    let url;
    try { url = new URL(input); } catch (_) { throw new Error('Invalid GitHub URL.'); }
    if (!/^https?:$/i.test(url.protocol) || !/^(www\.)?github\.com$/i.test(url.hostname)) throw new Error('Deployment requires a GitHub repository URL.');
    const parts = url.pathname.split('/').filter(Boolean);
    if (parts.length < 2) throw new Error('Invalid GitHub repository URL.');
    return {owner:parts[0],repo:parts[1].replace(/\.git$/i,'')};
  }
  async function getRepositoryInfo(owner, repo) {
    const response = await network.request(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, undefined, {headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}}, 'deployment-github-api');
    if (!response.ok) throw new Error(`GitHub repository lookup failed (${response.status}).`);
    const data = await response.json();
    return {defaultBranch:String(data?.default_branch || 'main')};
  }
  async function loadArchive(owner, repo, ref) {
    const codeload = `https://codeload.github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/zip/${encodeURIComponent(ref).replace(/%2F/g,'/')}`;
    const response = await network.request(codeload, undefined, {}, 'deployment-archive');
    if (!response.ok) throw new Error(`GitHub archive download failed (${response.status}).`);
    setProgress('Downloading project archive…', response.headers?.get?.('content-length') ? 0 : null, 'Connecting to GitHub…');
    const blob = await responseToBlobWithProgress(response, 'Downloading project archive…');
    if (!blob.size) throw new Error('GitHub returned an empty project archive.');
    return blob;
  }
  function flattenZip(file) {
    setProgress('Inspecting project archive…', 0, 'Reading ZIP structure…');
    return JSZip.loadAsync(file, {
      createFolders: true,
      onUpdate: meta => setProgress(
        'Inspecting project archive…',
        Number(meta?.percent) || 0,
        meta?.currentFile ? `Reading ${meta.currentFile}` : 'Reading ZIP structure…'
      )
    }).then(async zip => {
      const entries = [], tops = new Set(); let rootFile = false;
      zip.forEach((path, entry) => {
        const clean = path.replace(/^\/+|\/+$/g,'');
        if (!clean) return;
        const parts = clean.split('/');
        if (parts.length === 1) { if (!entry.dir) rootFile = true; return; }
        tops.add(parts[0]); entries.push({clean,entry});
      });
      if (rootFile || tops.size !== 1 || !entries.length) return file;
      const root = [...tops][0];
      if (!entries.some(item => item.clean.startsWith(root + '/'))) return file;
      const out = new JSZip();
      for (const item of entries) {
        if (!item.clean.startsWith(root + '/')) continue;
        const target = item.clean.slice(root.length + 1);
        if (!target) continue;
        if (item.entry.dir) out.folder(target);
        else out.file(target, await item.entry.async('uint8array'));
      }
      const blob = await out.generateAsync(
        {type:'blob'},
        meta => setProgress(
          'Flattening project archive…',
          Number(meta?.percent) || 0,
          meta?.currentFile ? `Writing ${meta.currentFile}` : 'Building normalized archive…'
        )
      );
      return new File([blob], file.name || 'project.zip', {type:'application/zip'});
    });
  }
  function readJSON(fs, path) {
    try { return fs.existsSync(path) ? JSON.parse(fs.readFileSync(path,'utf8') || '{}') : {}; }
    catch (_) { return {}; }
  }
  function normalizeRoot(value) { return '/' + String(value || '/').replace(/^\/+|\/+$/g,''); }
  function normalizePath(value) {
    let s = String(value || '/').trim();
    if (!s) return '/';
    try {
      const url = new URL(s, 'http://deployment.local');
      s = url.pathname || '/';
      if (!s.startsWith('/')) s = '/' + s;
      const suffix = (url.search || '') + (url.hash || '');
      return (s === '/' ? '/' : s.replace(/\/+$/,'')) + suffix;
    } catch (_) {
      if (!s.startsWith('/')) s = '/' + s;
      return s === '/' ? '/' : s.replace(/\/+$/,'');
    }
  }
  function pathParts(value) {
    const raw = normalizePath(value);
    const match = raw.match(/^([^?#]*)([?#].*)?$/);
    return {pathname:match?.[1] || '/', suffix:match?.[2] || ''};
  }
  function readProcessEnv(fs) {
    try {
      if (!fs?.existsSync?.('/.editor/process.env')) return {};
      const env = {};
      for (const raw of String(fs.readFileSync('/.editor/process.env', 'utf8') || '').split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith('#')) continue;
        const body = line.startsWith('export ') ? line.slice(7).trim() : line;
        const i = body.indexOf('=');
        if (i <= 0) continue;
        const key = body.slice(0, i).trim();
        if (!key) continue;
        let value = body.slice(i + 1).trim();
        if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
          value = value.slice(1, -1);
        }
        env[key] = value.replace(/\\n/g, '\n');
      }
      return env;
    } catch (_) {
      return {};
    }
  }

  function normalizeDomain(value) {
    let s = String(value || 'http://localhost:3000/').trim();
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'http://' + s;
    try { return new URL(s).origin; } catch (_) { return 'http://localhost:3000'; }
  }
  async function main() {
    if (!githubURL) throw new Error('Deployment requires a github query parameter.');
    const repo = parseGithub(githubURL);
    const repository = await getRepositoryInfo(repo.owner, repo.repo);
    const branchOverride = params.has('branch') ? String(params.get('branch') || '').trim() : null;
    const commitOverride = params.has('commit') ? String(params.get('commit') || '').trim() : null;
    const urlOverride = params.has('url') ? String(params.get('url') || '').trim() : null;
    const modeOverride = params.has('deploymentMode') ? String(params.get('deploymentMode') || '').trim() : null;
    const externalUrlOverride = params.has('externalUrl') ? String(params.get('externalUrl') || '').trim() : null;
    const externalModeOverride = params.has('externalMode') ? String(params.get('externalMode') || '').trim() : null;
    const peerOverride = params.has('peerServer')
      ? (params.get('peerServer') === '1' || params.get('peerServer') === 'true' || params.get('peerServer') === '')
      : (params.has('usePeerNetwork') ? (params.get('usePeerNetwork') === '1' || params.get('usePeerNetwork') === 'true' || params.get('usePeerNetwork') === '') : null);

    let resolvedRef = commitOverride !== null
      ? (commitOverride && commitOverride !== 'latest' ? commitOverride : (branchOverride || repository.defaultBranch))
      : (branchOverride || repository.defaultBranch);

    async function loadRevision(ref) {
      status.textContent = 'Loading deployment revision…';
      setProgress('Downloading project archive…', null, 'Preparing download…');
      let blob = await loadArchive(repo.owner, repo.repo, ref);
      setProgress('Preparing project files…', null, `Archive downloaded: ${formatBytes(blob.size)}`);
      let file = await flattenZip(new File([blob], repo.repo + '.zip', {type:'application/zip'}));
      setProgress('Indexing project files…', null, 'Building virtual filesystem…');
      let fs = await FileSystem.create(file, {sync:false});
      setProgress('Project ready', 100, `${formatBytes(blob.size)} archive`);
      return {blob,file,fs};
    }

    let revision = await loadRevision(resolvedRef);
    let fs = revision.fs;
    let hasDeploymentConfig = false;
    try { hasDeploymentConfig = !!fs.existsSync('/.editor/deployment.json'); } catch (_) {}
    let deploymentConfig = hasDeploymentConfig ? readJSON(fs, '/.editor/deployment.json') : {};

    if (commitOverride === null && branchOverride === null && hasDeploymentConfig) {
      const savedBranch = String(deploymentConfig.branch || '').trim();
      const savedCommit = String(deploymentConfig.commit || '').trim();
      const savedRef = savedCommit || savedBranch || repository.defaultBranch;
      if (savedRef && savedRef !== resolvedRef) {
        status.textContent = 'Loading saved deployment revision…';
        resolvedRef = savedRef;
        revision = await loadRevision(resolvedRef);
        fs = revision.fs;
        try { hasDeploymentConfig = !!fs.existsSync('/.editor/deployment.json'); } catch (_) { hasDeploymentConfig = false; }
        deploymentConfig = hasDeploymentConfig ? readJSON(fs, '/.editor/deployment.json') : {};
      }
    }

    const projectMeta = readJSON(fs, '/.editor/project.json');
    const runConfigFromProject = readJSON(fs, '/.editor/config.json');
    const inferredRunConfig = {
      serverType: 'static',
      domain: 'http://localhost:3000/',
      path: '/',
      rootfolder: '/',
      runfile: '/index.html',
      cwd: '/',
      nodeCommand: ''
    };
    const runConfig = hasDeploymentConfig ? {...inferredRunConfig, ...runConfigFromProject} : inferredRunConfig;

    // A project without deployment.json is intentionally treated as a static deployment.
    // It must have a root index.html; otherwise there is no unambiguous deployment entry.
    if (!hasDeploymentConfig) {
      let hasIndex = false;
      try { hasIndex = !!fs.existsSync('/index.html'); } catch (_) {}
      if (!hasIndex) {
        status.textContent = 'Please configure deployment in editor';
        status.className = 'error';
        return;
      }
    }

    const savedMode = deploymentConfig.mode || projectMeta?.deployment?.mode ||
      ((deploymentConfig.externalUrl || projectMeta?.deployment?.externalUrl) ? 'third-party' : 'editor');
    const deploymentMode = modeOverride === 'third-party' || modeOverride === 'editor'
      ? modeOverride
      : (savedMode === 'third-party' ? 'third-party' : 'editor');
    const externalUrl = externalUrlOverride !== null
      ? externalUrlOverride
      : String(deploymentConfig.externalUrl || projectMeta?.deployment?.externalUrl || '').trim();
    const externalMode = externalModeOverride === 'emulate' || String(deploymentConfig.externalMode || projectMeta?.deployment?.externalMode || '') === 'emulate'
      ? 'emulate'
      : 'iframe';
    const saveEnvironmentVariables =
      deploymentConfig.saveEnvironmentVariables === true ||
      projectMeta?.deployment?.saveEnvironmentVariables === true;
    const deploymentEnvironment = saveEnvironmentVariables ? readProcessEnv(fs) : {};
    const type = runConfig.serverType === 'node' ? 'node' : 'static';

    // Third-party deployments have their own target URL and do not use the editor runtime.
    // If the URL is missing, fall through to the normal editor deployment using the rest of the settings.
    if (deploymentMode === 'third-party' && externalUrl) {
      const targetUrl = new URL(externalUrl);
      const domain = targetUrl.origin;
      const pageURL = targetUrl.href;

      function canonicalizeThirdParty() {
        try {
          const canonical = new URL(location.href);
          canonical.searchParams.delete('githubUrl');
          canonical.searchParams.delete('sha');
          canonical.searchParams.set('github', githubURL);
          canonical.searchParams.set('commit', resolvedRef);
          if (branchOverride !== null) canonical.searchParams.set('branch', branchOverride); else canonical.searchParams.delete('branch');
          canonical.searchParams.delete('path');
          canonical.searchParams.delete('url');
          canonical.searchParams.set('deploymentMode', 'third-party');
          canonical.searchParams.set('externalUrl', pageURL);
          canonical.searchParams.set('externalMode', externalMode);
          canonical.searchParams.delete('peerServer');
          canonical.searchParams.delete('usePeerNetwork');
          history.replaceState({}, document.title, canonical.pathname + canonical.search + canonical.hash);
        } catch (_) {}
      }

      if (externalMode === 'iframe') {
        stage.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = pageURL;
        iframe.setAttribute('allow', 'fullscreen; clipboard-read; clipboard-write');
        stage.appendChild(iframe);
        stage.classList.add('ready');
        canonicalizeThirdParty();
        setProgress('Deployment ready', 100, pageURL);
        setTimeout(hideProgress, 180);
        status.remove();
        return;
      }

      // Third-party emulation uses the existing browser-network + PageEmulator stack.
      const iframe = document.createElement('iframe');
      stage.appendChild(iframe);
      stage.classList.add('ready');
      const page = new PageEmulator(iframe, {network, location:{url:pageURL,origin:domain}, history:[]});
      let externalRuntimeReady = false;
      function forwardConsole(method, args) {
        const target = method === 'logText' ? console.log : console[method];
        if (typeof target !== 'function') return;
        try { target.apply(console, Array.isArray(args) ? args : [args]); } catch (_) {}
      }
      function forwardError(error, location) {
        const message = error?.message || String(error);
        const stack = error?.error?.stack || error?.stack || '';
        const suffix = location ? ` (${location})` : '';
        try { console.error(`Uncaught Error${suffix}: ${message}`, stack); } catch (_) {}
      }
      async function getExternalDocumentContent(response, url) {
        const contentType = String(response.headers.get('content-type') || 'text/html').toLowerCase();
        if (contentType.includes('text/html') || contentType.includes('application/xhtml+xml') || contentType.includes('application/xml') || contentType.includes('text/xml')) return await response.clone().text();
        return await response.clone().text();
      }
      function installExternalInterceptors(currentPage) {
        currentPage.interceptEvent('console', (method,args)=>forwardConsole(method,args));
        currentPage.interceptEvent('error', (error,location)=>forwardError(error,location));
        currentPage.interceptEvent('iframe-create', obj => {
          if (!obj?.iframe) return null;
          if (obj.iframe.pageEmulator) return obj.iframe.pageEmulator;
          const child = new PageEmulator(obj.iframe,{network,location:{url:'about:blank',origin:currentPage.location?.origin || domain},history:[]});
          obj.iframe.pageEmulator=child; currentPage.addChild?.(child); installExternalInterceptors(child); child.setLocation('about:blank',currentPage.location?.origin || domain); return child;
        });
        currentPage.interceptEvent('iframe-navigate', async obj => {
          const frame=obj?.iframe; if(!frame) return;
          const child=frame.pageEmulator; if(!child || !obj.src) return;
          let target; try { target=new URL(obj.src,currentPage.location?.url || domain+'/'); } catch(_) { return; }
          child.setLocation(target.href,target.origin);
          const res=await child.network.request(target.href,target.origin,{},'iframe');
          if(!res?.ok) return;
          const html=await getExternalDocumentContent(res,target.href);
          child.rawDocument=String(html||'');
          await child.setDocument(html,true,target.href);
        });
      }
      installExternalInterceptors(page);
      setProgress('Loading third-party deployment…', null, pageURL);
      const response = await network.request(pageURL, domain, {}, 'third-party-deployment');
      if (!response?.ok) throw new Error(`Third-party deployment failed to load (${response?.status || 'no response'}).`);
      const html = await getExternalDocumentContent(response,pageURL);
      await page.setDocument(html,true,pageURL);
      externalRuntimeReady = true;
      canonicalizeThirdParty();
      setProgress('Deployment ready', 100, pageURL);
      setTimeout(hideProgress, 180);
      status.remove();
      return;
    }

    const savedUrl = String(deploymentConfig.url || projectMeta?.deployment?.url || '').trim();
    function resolveEditorTarget(value) {
      const raw = String(value || '').trim();
      const domain = String(runConfig.domain || 'http://localhost:3000').replace(/\/+$/,'');
      if (!raw) {
        const path = String(runConfig.path || '/');
        return domain + (path.startsWith('/') ? path : '/' + path);
      }
      try {
        const absolute = new URL(raw);
        if (/^https?:$/i.test(absolute.protocol)) return absolute.href;
      } catch (_) {}
      const path = raw.startsWith('/') ? raw : '/' + raw;
      return domain + path;
    }
    const rawConfiguredUrl = String(urlOverride || savedUrl || '').trim();
    const configuredDomain = normalizeDomain(runConfig.domain);
    const target = resolveEditorTarget(rawConfiguredUrl);
    const targetUrl = new URL(target);

    // A configured absolute URL that points outside the virtual deployment
    // domain is a real site, not a project route. Leave the emulator entirely
    // and let the browser open the site normally.
    if (rawConfiguredUrl && (rawConfiguredUrl.startsWith('http://') || rawConfiguredUrl.startsWith('https://')) && targetUrl.origin !== configuredDomain) {
      location.replace(targetUrl.href);
      return;
    }

    const domain = targetUrl.origin;
    const runtimePath = targetUrl.pathname || '/';
    const usePeerServer = peerOverride === null ? (!!deploymentConfig.usePeerServer || !!projectMeta?.deployment?.usePeerServer) : !!peerOverride;
    let peerEndpoint = null;
    if (usePeerServer) { try { peerEndpoint = new PeerEndpoint(); } catch (e) { console.warn('Peer network unavailable:', e); } }
    const root = normalizeRoot(runConfig.rootfolder);
    let runtime;
    function forwardConsole(method, args) {
      const target = method === 'logText' ? console.log : console[method];
      if (typeof target !== 'function') return;
      try { target.apply(console, Array.isArray(args) ? args : [args]); } catch (_) {}
    }
    function forwardError(error, location) {
      const message = error?.message || String(error);
      const stack = error?.error?.stack || error?.stack || '';
      const suffix = location ? ` (${location})` : '';
      try { console.error(`Uncaught Error${suffix}: ${message}`, stack); } catch (_) {}
    }
    if (type === 'static') {
      runtime = new StaticEndpoint({domain, path:runtimePath, rootfolder:root, runfile:runConfig.runfile || '/index.html', filesystem:fs});
      await runtime.loading;
    } else {
      runtime = new NodeEmulator({domain,rootfolder:root,pathPrefix:runtimePath,filesystem:fs,fileSystemSync:false,network,cwd:runConfig.cwd || '/',env:{NODE_ENV:'production',USER:'browser_user',...deploymentEnvironment}});
      await runtime.ready;
      if (runConfig.nodeCommand) await runtime.terminalCommand(runConfig.nodeCommand);
      if (!await runtime.waitForServer?.(10000,50)) throw new Error('Node command finished, but no listening server was created.');
    }

    const runtimeEndpoint = type === 'node' ? runtime.endpoint : runtime;
    const deploymentEndpoints = [runtimeEndpoint];
    if (peerEndpoint) deploymentEndpoints.push(peerEndpoint);
    deploymentEndpoints.push(
      network.__deploymentBaseEndpoints.native,
      network.__deploymentBaseEndpoints.primary,
      network.__deploymentBaseEndpoints.fallback
    );
    network.setEndpoints(deploymentEndpoints);

    if (runtime?.addEventListener) {
      runtime.addEventListener('console', (method, args) => forwardConsole(method, args));
      runtime.addEventListener('error', (error, location) => forwardError(error, location));
    }
    if (usePeerServer) {
      const layer = String(deploymentConfig.peerLayer || projectMeta?.peerLayer || 'peer').trim() || 'peer';
      status.textContent = 'Starting peer server…';
      window.__deploymentPeerServer = await ensurePeerServer(domain, async()=>type === 'node' ? runtime.endpoint : runtime, {peerLayer:layer});
    }
    const iframe = document.createElement('iframe');
    stage.appendChild(iframe);
    const pageURL = targetUrl.href;
