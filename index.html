(function () {
  const MESSAGE_TYPE = 'watermelonkatanas:host-context';

  function applyHostContext(payload, senderOrigin) {
    try {
      const parsed = new URL(String(payload && payload.url || '').trim());
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return false;
      if (parsed.origin !== senderOrigin) return false;
      if (payload.origin && payload.origin !== parsed.origin) return false;

      const context = Object.freeze({url: parsed.href, origin: parsed.origin});
      window.__wkHostContext = context;
      window.dispatchEvent(new CustomEvent('wk-host-context-change', {detail: context}));
      return true;
    } catch (_) {
      return false;
    }
  }

  // Until the embedding page supplies a value, the Editor itself is the host.
  window.__wkHostContext = Object.freeze({url: window.location.href, origin: window.location.origin});

  window.addEventListener('message', function (event) {
    if (window.parent === window || event.source !== window.parent) return;
    if (event.data && event.data.type === MESSAGE_TYPE) {
      applyHostContext(event.data, event.origin);
    }
  });

  // WatermelonKatana's remote bridge already supplies hostUrl in this config.
  // Reuse it so the existing integration also initializes host context.
  window.addEventListener('editorhostready', function (event) {
    const config = event.detail && event.detail.config || window.EditorHostConfig || {};
    if (!config.hostUrl) return;
    try {
      const parsed = new URL(config.hostUrl);
      applyHostContext({url: parsed.href, origin: config.origin || parsed.origin}, config.origin || parsed.origin);
    } catch (_) {}
  });
})();
